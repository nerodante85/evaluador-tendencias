name: Monitorizar fuente de datos (pytrends)

# Chequeo semanal, barato (una sola consulta chica, no las 474 series reales):
# `pytrends` es una librería no oficial, archivada desde abril de 2025, y
# puede romperse sin aviso (docs/plan-respaldo-fuentes.md). Sin esto, la
# única forma de enterarse era que alguien corriera un script a mano y viera
# el error — hallazgo de la auditoría del 2026-09-27 (AUDIT-REPORT.md,
# sección 32 "Monitorización").
#
# Si falla, abre un issue (una sola vez, no uno por semana mientras siga
# caído). Si vuelve a funcionar, cierra ese issue solo. No descarga ni toca
# ningún dato real del pipeline — data/v2/raw/ y src/data/ no se tocan aquí.

on:
  schedule:
    - cron: "0 13 * * 1" # todos los lunes, 13:00 UTC (~8am Colombia)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-fuente
  cancel-in-progress: false

env:
  ETIQUETA_ISSUE: "fuente-caida"

jobs:
  chequeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - run: pip install -r pipeline/requirements.txt

      - name: Probar pytrends con una consulta chica
        id: chequeo
        run: python -m pipeline.cli monitor-fuente
        continue-on-error: true

      - name: Abrir issue si falló (y no hay uno abierto ya)
        if: steps.chequeo.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const etiqueta = process.env.ETIQUETA_ISSUE;
            const { data: abiertos } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: etiqueta,
            });
            if (abiertos.length > 0) {
              console.log(`Ya hay un issue abierto (#${abiertos[0].number}) — no se crea otro.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "pytrends dejó de funcionar (chequeo automático)",
              labels: [etiqueta],
              body: [
                "El chequeo semanal (`.github/workflows/monitor-fuente.yml`) no pudo traer datos de Google Trends.",
                "",
                "`pytrends` es una librería no oficial, archivada desde abril de 2025 — esto puede pasar sin aviso.",
                "",
                "**Qué revisar:**",
                `- El log de esta corrida: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "- Si es un bloqueo pasajero (HTTP 429), puede resolverse solo la próxima semana.",
                "- Si sigue fallando varias semanas seguidas, ver las alternativas en `docs/plan-respaldo-fuentes.md`.",
                "",
                "Este issue se cierra solo cuando el chequeo vuelva a pasar.",
              ].join("\n"),
            });

      - name: Cerrar el issue si ya volvió a funcionar
        if: steps.chequeo.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const etiqueta = process.env.ETIQUETA_ISSUE;
            const { data: abiertos } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: etiqueta,
            });
            for (const issue of abiertos) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "El chequeo de esta semana volvió a pasar — cerrando.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

      - name: Marcar el job como fallido si el chequeo falló
        if: steps.chequeo.outcome == 'failure'
        run: exit 1

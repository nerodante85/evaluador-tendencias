name: Publicar panel en GitHub Pages

# Cada push a main compila el panel y lo publica. No hay que hacer nada más:
# corres fetch_trends.py, haces commit del JSON que cambió, push, y en un par
# de minutos el sitio está actualizado.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos commits seguidos, deja correr el último y cancela el
# anterior en vez de publicar dos veces.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Acciones ancladas al commit exacto (no al tag mutable) por seguridad
      # de cadena de suministro: un tag como @v4 puede reapuntarse a otro
      # commit sin que este archivo cambie. El comentario deja la versión
      # legible; el hash es lo que realmente se ejecuta.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

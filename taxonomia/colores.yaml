# Colores. `hex` es el color de referencia para mostrarlo; `familia` agrupa
# para la navegación. Se miden por el nombre del color dentro de la categoría
# Ropa de Google Trends (así "negro" cuenta búsquedas de ropa negra, no del
# adjetivo suelto). Familias: neutro, marron, azul, verde, amarillo, naranja,
# rojo, rosa, morado, metalico.
tipo: color
nodos:
  - {id: color.negro, nombre: Negro, q: negro, hex: "#111111", familia: neutro}
  - {id: color.blanco, nombre: Blanco, q: blanco, hex: "#F5F5F0", familia: neutro}
  - {id: color.beige, nombre: Beige y arena, q: beige, hex: "#D9C7A7", familia: neutro, v1: [4]}
